{% extends 'base.html' %}

{% block title %}Hapus Quotation{% endblock %}
{% block page_title %}Hapus Quotation{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-custom">
                <div class="card-body text-center py-5">
                    <i class="ph-duotone ph-warning text-danger" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">Konfirmasi Hapus</h4>
                    <p class="text-muted">
                        Anda yakin ingin menghapus quotation <strong>QUO-{{ object.pk|stringformat:"04d" }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="{% url 'crm:quotation-list' %}" class="btn btn-outline-secondary">Batal</a>
                            <button type="submit" class="btn btn-danger">
                                <i class="ph-duotone ph-trash me-1"></i> Ya, Hapus
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
