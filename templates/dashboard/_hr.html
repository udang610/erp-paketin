<!-- HR Dashboard Component -->
<div class="row g-4 mb-4">
    <div class="col-md-{% if is_single_role %}4{% else %}3{% endif %}">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid var(--pk-hr-accent) !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-purple mb-0" style="color: var(--pk-hr-accent)"><i class="ph-duotone ph-users me-1"></i> Pegawai Aktif</h6>
                    <h3 class="mb-0">{{ hr_employees }}</h3>
                </div>
                <div class="small text-muted">{{ hr_attendances }} Data Kehadiran</div>
            </div>
        </div>
    </div>
    {% if is_single_role %}
    <div class="col-md-4">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #198754 !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-success mb-0"><i class="ph-duotone ph-user-check me-1"></i> Hadir Hari Ini</h6>
                    <h3 class="mb-0">{{ hr_present|default:0 }}</h3>
                </div>
                <div class="small text-muted">Dari total pegawai</div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #dc3545 !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-danger mb-0"><i class="ph-duotone ph-user-minus me-1"></i> Tidak Hadir</h6>
                    <h3 class="mb-0">{{ hr_absent|default:0 }}</h3>
                </div>
                <div class="small text-muted">Cuti, Sakit, Alpa</div>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="col-lg-{% if is_single_role %}12{% else %}4{% endif %}">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="ph-duotone ph-users-three me-2" style="color: var(--pk-hr-accent)"></i>Statistik Kehadiran (HR)</h6>
                <button class="btn btn-sm btn-light"><i class="ph-bold ph-dots-three"></i></button>
            </div>
            <div class="card-body d-flex align-items-center justify-content-center">
                <canvas id="hrChart" height="240"></canvas>
            </div>
        </div>
    </div>
</div>
