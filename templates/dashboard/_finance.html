{% load humanize %}
<!-- Finance Dashboard Component -->
<div class="row g-4 mb-4">
    <div class="col-md-{% if is_single_role %}6{% else %}3{% endif %}">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid var(--pk-fin-accent) !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-primary mb-0"><i class="ph-duotone ph-wallet me-1"></i> Total Pendapatan</h6>
                    <h3 class="mb-0">Rp {{ total_revenue|floatformat:"0"|intcomma }}</h3>
                </div>
                <div class="small text-muted">{{ finance_records }} Invoice Lunas</div>
            </div>
        </div>
    </div>
    {% if is_single_role %}
    <div class="col-md-6">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #198754 !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-success mb-0"><i class="ph-duotone ph-money me-1"></i> Keuntungan Bersih</h6>
                    <h3 class="mb-0">Rp {{ total_profit|default:0|floatformat:"0"|intcomma }}</h3>
                </div>
                <div class="small text-muted">Bulan ini</div>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="col-md-{% if is_single_role %}12{% else %}9{% endif %}">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="ph-duotone ph-chart-line me-2 text-primary"></i>Tren Keuangan (Finance)</h6>
                <button class="btn btn-sm btn-light"><i class="ph-bold ph-dots-three"></i></button>
            </div>
            <div class="card-body">
                <canvas id="financeChart" height="240"></canvas>
            </div>
        </div>
    </div>
</div>
