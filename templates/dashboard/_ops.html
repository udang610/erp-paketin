<!-- Operations Dashboard Component -->
<div class="row g-4 mb-4">
    <div class="col-md-{% if is_single_role %}3{% else %}3{% endif %}">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid var(--pk-ops-accent) !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-warning mb-0"><i class="ph-duotone ph-truck me-1"></i> Total Pengiriman</h6>
                    <h3 class="mb-0">{{ ops_total|default:"0" }}</h3>
                </div>
                <div class="small text-muted">Seluruh status</div>
            </div>
        </div>
    </div>
    {% if is_single_role %}
    <div class="col-md-3">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #6c757d !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-secondary mb-0"><i class="ph-duotone ph-package me-1"></i> Pending</h6>
                    <h3 class="mb-0">{{ ops_pending }}</h3>
                </div>
                <div class="small text-muted">Belum jalan</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #0dcaf0 !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-info mb-0"><i class="ph-duotone ph-navigation-arrow me-1"></i> In Transit</h6>
                    <h3 class="mb-0">{{ ops_in_transit }}</h3>
                </div>
                <div class="small text-muted">Sedang di jalan</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card h-100 border-0 shadow-sm" style="border-left: 4px solid #198754 !important;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="card-title text-success mb-0"><i class="ph-duotone ph-check-circle me-1"></i> Delivered</h6>
                    <h3 class="mb-0">{{ ops_delivered }}</h3>
                </div>
                <div class="small text-muted">Sampai tujuan</div>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="col-md-{% if is_single_role %}4{% else %}3{% endif %}">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="ph-duotone ph-chart-donut me-2 text-warning"></i>Status Pengiriman (Ops)</h6>
                <button class="btn btn-sm btn-light"><i class="ph-bold ph-dots-three"></i></button>
            </div>
            <div class="card-body d-flex align-items-center justify-content-center">
                <canvas id="opsChart" height="240"></canvas>
            </div>
        </div>
    </div>
    
    <div class="col-md-{% if is_single_role %}8{% else %}6{% endif %}">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-0 pt-3 pb-0">
                <h6 class="mb-0"><i class="ph-duotone ph-map-trifold me-2 text-primary"></i>Peta Distribusi Pengiriman Nasional</h6>
            </div>
            <div class="card-body p-0">
                <div id="indoMap" style="height: 400px; width: 100%; border-radius: 12px; overflow: hidden; background: #1a1a2e; z-index: 1;"></div>
            </div>
        </div>
    </div>
</div>
