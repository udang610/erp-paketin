<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Terjadi Kendala Sistem | Paketin Cargo</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef5f1 0%, #e2ece6 45%, #f1f6f3 100%) fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff1f2;
            color: #ed1c2e;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .btn-home {
            background-color: #ed1c2e;
            border-color: #ed1c2e;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 24px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background-color: #dc2626;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">500</div>
        <h4 class="fw-bold text-dark mb-2">Terjadi Kendala pada Sistem</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem; line-height: 1.6;">
            Mohon maaf, sistem sedang mengalami kendala sementara. Tim teknis telah menerima laporan kendala ini dan sedang melakukan penanganan.
        </p>
        <div>
            <a href="/" class="btn-home">Kembali ke Beranda</a>
        </div>
    </div>
</body>
</html>
