{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <img src="/static/img/logo.webp" alt="Paketin Cargo Logo" style="max-width: 220px; margin-bottom: 15px;">
        </div>

        {% if form.errors %}
        <div class="alert alert-danger">
            <i class="ph-duotone ph-warning me-2"></i>
            Username atau password salah. Silakan coba lagi.
        </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="ph-duotone ph-user"></i></span>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Masukkan username" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="ph-duotone ph-lock-key"></i></span>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-danger w-100 btn-login">
                <i class="ph-duotone ph-sign-in me-2"></i>Login
            </button>
        </form>


    </div>
</div>

<script>
    // Menghilangkan ?next=/ atau parameter lain dari URL bar agar terlihat rapi
    if (window.history.replaceState && window.location.search) {
        window.history.replaceState(null, null, window.location.pathname);
    }
</script>
{% endblock %}
