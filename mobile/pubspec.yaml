name: hr_paketin
description: Paketin Cargo HR & Attendance Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  riverpod: ^2.4.3
  flutter_riverpod: ^2.4.3
  
  # Networking
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  
  # Location & Camera
  geolocator: ^10.1.0
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.8.0
  
  # UI & Styling
  google_fonts: ^8.2.1
  intl: ^0.20.3
  shimmer: ^3.0.0
  table_calendar: ^3.2.1
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  retrofit_generator: ^8.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
